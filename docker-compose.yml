# ---------------------------------------------------------------------------
# OS1 Fiber Track Pro - self-hosting stack
#
#   1. Copy .env.docker.example to .env and fill in the values.
#   2. Run:  docker compose up -d --build
#   3. Open: http://localhost:3000  (or your server's address)
#
# The reference/config seed creates NO user accounts. Create the first admin
# through the app's first-run setup after the stack is up.
# ---------------------------------------------------------------------------
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fibertrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fibertrack_pw}
      POSTGRES_DB: ${POSTGRES_DB:-fibertrack}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fibertrack} -d ${POSTGRES_DB:-fibertrack}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    # The running image is pulled from this ref. A normal `docker compose up -d`
    # (or `--build`) uses contractor-app:current. scripts/os1-upgrade.sh builds a
    # candidate as contractor-app:candidate-<sha>, validates it, then cuts over by
    # setting CONTRACTOR_APP_IMAGE to that candidate and asserting the running
    # container's image id equals the validated candidate's image id.
    image: ${CONTRACTOR_APP_IMAGE:-contractor-app:current}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Stamp the running image with the commit it was built from so the
        # Update Center can show the exact short SHA. Pass on the CLI, e.g.
        #   APP_BUILD_SHA=$(git rev-parse HEAD) docker compose up -d --build
        APP_BUILD_SHA: ${APP_BUILD_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # --- Database (points at the db service above) ---
      DATABASE_URL: postgresql://${POSTGRES_USER:-fibertrack}:${POSTGRES_PASSWORD:-fibertrack_pw}@db:5432/${POSTGRES_DB:-fibertrack}?connect_timeout=15

      # --- Authentication (REQUIRED) ---
      # Generate a secret with:  openssl rand -base64 32
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in your .env file}
      AUTH_SECRET: ${AUTH_SECRET:-${NEXTAUTH_SECRET}}
      # Public URL users reach the app at. For a remote server use e.g.
      # https://fibertrack.yourdomain.com
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}

      # --- First-run seeding (idempotent). Set to false after first boot if you prefer. ---
      SEED_ON_START: ${SEED_ON_START:-false}

      # --- File storage (photos / documents). Any S3-compatible bucket. ---
      # Uploads are disabled/error out until these are provided.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-}
      AWS_FOLDER_PREFIX: ${AWS_FOLDER_PREFIX:-}

      # --- Secret encryption key (REQUIRED for SMTP/integration secrets) ---
      # Generate once with:  openssl rand -hex 32   (store in your .env, never in git)
      # Passed through from the host .env so the app can encrypt/decrypt secrets
      # at rest (AES-256-GCM). Left optional here so the container still boots and
      # reports "Encryption configuration: MISSING" (fail-closed) if it is unset,
      # rather than refusing to start.
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}

      # --- Build/version stamp (shown in the Update Center) ---
      APP_BUILD_SHA: ${APP_BUILD_SHA:-unknown}

      # --- Domain & SSL control plane ---
      # Where the app writes the generated Caddyfile (shared volume the proxy
      # reads). Overridable, but this is the in-container default.
      CADDY_GENERATED_PATH: ${CADDY_GENERATED_PATH:-/caddy-generated/sites.caddy}
      # Persisted canonical-URL config fragment (managed by set-app-url.mjs).
      APP_URL_CONFIG_PATH: ${APP_URL_CONFIG_PATH:-/app/data/app-url.env}
      # Optional public-IP override for servers behind NAT.
      APPLIANCE_PUBLIC_IPV4: ${APPLIANCE_PUBLIC_IPV4:-}
      APPLIANCE_PUBLIC_IPV6: ${APPLIANCE_PUBLIC_IPV6:-}
    # NOTE: the app publishes NO host port here. Direct host access for local
    # development is added by docker-compose.override.yml (auto-loaded by a
    # plain `docker compose up`). In production you run:
    #   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
    # which does NOT load the override, so the app is reachable ONLY through the
    # proxy on 80/443 and its port 3000 is never published to the host.
    expose:
      - "3000"
    volumes:
      # Persist runtime-writable app data (update staging/backups + locally
      # stored branding/logo) across container recreation/rebuild/restart.
      - app_data:/app/data
      # Shared volume: the app WRITES the generated Caddyfile here; the proxy
      # mounts the same volume read-only and picks up changes automatically.
      - caddy_generated:/caddy-generated

  # ---------------------------------------------------------------------------
  # Reverse proxy / TLS terminator (Domain & SSL). Caddy owns ALL ACME work:
  # Let's Encrypt issuance, certificate storage, automatic renewal, HTTP->HTTPS
  # redirect, SNI and hot config reload. The app never speaks ACME. Certificate
  # private keys live ONLY inside the caddy_data volume and are never exposed to
  # the app, the database, Git, logs or the UI.
  # ---------------------------------------------------------------------------
  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Base Caddyfile imports the generated per-domain config. Read-only.
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Generated per-domain config (written by the app). Read-only to proxy.
      - caddy_generated:/caddy-generated:ro
      # PERSISTENT: ACME account, issued certificates + private keys, renewal
      # state. MUST survive restart/recreate/update/rebuild/reboot.
      - caddy_data:/data
      # PERSISTENT: Caddy's autosaved runtime config.
      - caddy_config:/config
    # --watch makes Caddy hot-reload when the generated config changes.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile", "--watch"]

volumes:
  db_data:
  app_data:
  # Domain & SSL persistence (see §7/§20). NEVER deleted by the updater.
  caddy_data:
  caddy_config:
  caddy_generated:
