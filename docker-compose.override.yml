# ---------------------------------------------------------------------------
# LOCAL DEVELOPMENT override (auto-loaded by a plain `docker compose up`).
#
# This publishes the app's port directly on the host so you can reach it at
# http://localhost:3000 without going through the reverse proxy. It is loaded
# automatically ONLY when you do not pass an explicit -f file list, so the
# production invocation:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# never picks it up and the app port stays unpublished behind the proxy.
# ---------------------------------------------------------------------------
services:
  app:
    ports:
      - "${APP_PORT:-3000}:3000"
